[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-platform-backend"
version = "0.1.0"
description = "White-label multi-tenant RAG chatbot platform — backend"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    # Validation & settings
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.0.0",
    # Auth & security
    "argon2-cffi>=23.1.0",
    "python-jose[cryptography]>=3.3.0",
    # Redis
    "redis[asyncio]>=5.2.0",
    # Email
    "aiosmtplib>=3.0.0",
    "jinja2>=3.1.4",
    # Utilities
    "python-multipart>=0.0.12",
    "httpx>=0.28.0",
    "orjson>=3.10.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-redis>=4.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["app"]
omit = ["*/migrations/*", "*/alembic/*"]

