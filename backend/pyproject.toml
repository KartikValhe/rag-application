[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-platform-backend"
version = "0.1.0"
description = "White-label multi-tenant RAG chatbot platform — backend"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    # Validation & settings
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.0.0",
    # Auth & security
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.8.0",
    # Redis
    "redis[asyncio]>=5.2.0",
    # Email
    "aiosmtplib>=3.0.0",
    "jinja2>=3.1.4",
    # File parsing & upload safety
    "openpyxl>=3.1.5",
    # Libraries that parse UNTRUSTED files, pinned exactly (review of 5b-3). The document parser's full set
    # is the `parser` extra below; these four stay in the base because the API image still runs them in
    # sandboxed CHILDREN or needs them itself, and the same versions must be installed everywhere:
    #   python-docx + lxml  the timetable DOCX import (timetable_parse_child, started by the API)
    #   pypdfium2           PDFium, which pdfplumber (timetable PDF import) loads
    #   pillow              branding image validation in the API process (services/storage.py)
    # The API PROCESS itself imports none of python-docx, lxml, pypdfium2 or python-pptx
    # (tests/test_review_5b3_deps.py). Licences and wheels: docs/phase5-design.md section 0d.
    # pip-audit cannot see PDFium CVEs (README.md): review the pypdfium2 pin on every release.
    "python-docx==1.2.0",
    "lxml==6.1.3",
    "pypdfium2==5.15.2",
    "pdfplumber>=0.11.0",
    "defusedxml>=0.7.1",
    # Utilities
    "python-multipart>=0.0.12",
    "pillow==13.0.0",
    "httpx>=0.28.0",
    "orjson>=3.10.0",
    "structlog>=24.4.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# Everything the sandboxed DOCUMENT parser (app/services/document_parse_child.py) loads, pinned exactly. The
# worker image installs it; the API image does not need python-pptx (the others are also in the base above,
# with the same pins). pip-audit does not see PDFium CVEs: review the pypdfium2 pin on each release.
parser = [
    "pypdfium2==5.15.2",
    "python-docx==1.2.0",
    "python-pptx==1.0.2",
    "lxml==6.1.3",
    "pillow==13.0.0",
]
# The embedding layer (app/ml): ONNX Runtime plus the Rust tokenizer, numpy only. No torch, no transformers,
# no huggingface_hub of our own (tokenizers 0.23.3 lists huggingface-hub as an install requirement, but
# nothing here imports it: tests/test_ml_embedder.py). The worker image installs it, and so does the API image
# when it embeds queries (design A5); the base dependencies above do NOT need it. Wheels for Python 3.12 on
# Windows x64, Linux x86_64 and Linux aarch64 are verified in docs/phase5-design.md section 0d (numpy: 5c-1).
ml = [
    "onnxruntime==1.32.0",
    "tokenizers==0.23.3",
    "numpy==2.5.5",
]
dev = [
    "rag-platform-backend[parser]",
    "rag-platform-backend[ml]",
    # Builds the tiny synthetic test model (tests/fixtures/ml.py); never needed at runtime.
    "onnx==1.23.2",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-redis>=4.6.0",
    "pip-audit>=2.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

# Third-party libraries that lack official PEP 561 py.typed markers or type stub packages.
# These libraries (openpyxl, python-docx, python-pptx, pypdfium2, pdfplumber, defusedxml) do not ship type definitions,
# so we instruct mypy to ignore missing imports for them while maintaining strict type
# checking across all internal application code.
[[tool.mypy.overrides]]
module = [
    "defusedxml",
    "defusedxml.*",
    "openpyxl",
    "openpyxl.*",
    "docx",
    "docx.*",
    "pptx",
    "pptx.*",
    "pypdfium2",
    "pypdfium2.*",
    "pdfplumber",
    "pdfplumber.*",
    # The embedding layer's libraries are imported lazily; only these ship no usable type information.
    "onnxruntime",
    "onnxruntime.*",
    "tokenizers",
    "tokenizers.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# The test-only child module (tests._tt_children) must be importable when the plain `pytest` script is used.
pythonpath = ["."]
addopts = "-v --tb=short --strict-markers"
markers = [
    # Tiers. One reviewed table, tests/tier_map.py, assigns them (a test file without an entry fails collection).
    "fast: needs no Postgres, Redis or child process; runs with docker stopped (enforced by an autouse fixture)",
    "db: needs Postgres and/or Redis (the test infrastructure from docker compose)",
    "subprocess: starts child processes (the sandboxed parsers, python -m checks)",
    "security: tenant isolation, authorization, hostile-input and sandbox tests; part of the gate tier",
    "slow: the file takes 30 s or more on a developer machine",
    "linux: added automatically to tests skipped off Linux (skipif reason names Linux or POSIX); they run in CI",
    "touched: added by --touched-tests (run_tests gate --touched) to the tests of the changed modules",
    "real_model: needs the real embedding model files on disk; skipped unless RUN_REAL_MODEL=1",
    "machine_dependent: wall-clock bounds; generous and relative to a baseline, but they can still fail on a very slow or loaded machine",
]

[tool.coverage.run]
source = ["app"]
omit = ["*/migrations/*", "*/alembic/*"]

