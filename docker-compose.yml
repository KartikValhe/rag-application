services:
  postgres:
    image: postgres:16-alpine
    container_name: rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ragplatform
    ports:
      - "5433:5432"
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rag-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: rag-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI port

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag-api
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://app_tenant:tenant_password@postgres:5432/ragplatform
      - PLATFORM_DATABASE_URL=postgresql+asyncpg://app_platform:platform_password@postgres:5432/ragplatform
      - MIGRATION_DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/ragplatform
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - PLATFORM_SECRET_KEY=fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
      - FRONTEND_URL=http://localhost:5173
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:

