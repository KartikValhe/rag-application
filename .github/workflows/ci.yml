name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ragplatform
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Initialize DB Roles & Schema
        run: |
          docker cp infra/postgres/init.sql ${{ job.services.postgres.id }}:/tmp/init.sql
          docker exec ${{ job.services.postgres.id }} psql -U postgres -f /tmp/init.sql

      - name: Install Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install hatchling
          pip install ".[dev]"

      - name: Security Audit (pip-audit)
        working-directory: ./backend
        run: pip-audit

      - name: Lint (Ruff)
        working-directory: ./backend
        run: ruff check .

      - name: Type Check (Mypy)
        working-directory: ./backend
        run: mypy app

      - name: Run Database Migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://app_tenant:tenant_password@localhost:5432/ragplatform_test
          PLATFORM_DATABASE_URL: postgresql+asyncpg://app_platform:platform_password@localhost:5432/ragplatform_test
          MIGRATION_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ragplatform_test
          REDIS_URL: redis://localhost:6379/1
          SECRET_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          PLATFORM_SECRET_KEY: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          ENVIRONMENT: development
        run: alembic upgrade head

      - name: Run Tests & Tenant Isolation Suite
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://app_tenant:tenant_password@localhost:5432/ragplatform_test
          PLATFORM_DATABASE_URL: postgresql+asyncpg://app_platform:platform_password@localhost:5432/ragplatform_test
          MIGRATION_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ragplatform_test
          REDIS_URL: redis://localhost:6379/1
          SECRET_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          PLATFORM_SECRET_KEY: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          ENVIRONMENT: development
        run: pytest

  frontend:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint
        working-directory: ./frontend
        run: npm run lint

      - name: Unit Tests
        working-directory: ./frontend
        run: npm test -- --run

      - name: Type Check
        working-directory: ./frontend
        run: npm run typecheck

      - name: Build
        working-directory: ./frontend
        run: npm run build

